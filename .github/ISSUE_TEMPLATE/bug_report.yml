name: Bug report
description: Something in mutation behaves differently from its documentation
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a vulnerability privately to support@mutation.sh, not here (see SECURITY.md).
        A command that exits 5 (`not_implemented`) is expected in 0.1.0: open a feature request instead.
        What you submit here is Feedback under section 20 of the Mutation CLI License (see CONTRIBUTING.md).
  - type: textarea
    id: version
    attributes:
      label: Version
      description: The output of `mutation --version --format json`.
      render: json
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - npm
        - npx
        - Homebrew
        - Release archive
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and version, and architecture.
      placeholder: macOS 26 on ARM64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: input
    id: exit
    attributes:
      label: Exit code
      description: "`echo $?` in bash or zsh, `$LASTEXITCODE` in PowerShell."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What it printed on stdout and stderr. Leave out credentials and private code.
      render: text
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest repository, settings file or patch that shows it, or its shape if it is private.
