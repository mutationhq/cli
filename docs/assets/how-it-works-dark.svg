<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">How Mutation works</title><desc id="d">Your repository is read by Lingua, Mutation&#x27;s own parsers, into a code graph in .mutation/data.mt. Verify, query, context and the HTML report read it, for you, your CI and your coding agents.</desc><rect width="960" height="360" rx="14" fill="#0d1117" stroke="#30363d"/><rect x="28" y="120" width="190" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="123" y="160" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">Your repository</text><text x="123" y="184" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">any git host, any revision,</text><text x="123" y="202" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">a patch or a folder</text><line x1="220" y1="175" x2="262" y2="175" stroke="#9198a1" stroke-width="1.6"/><path d="M262,175 l-8,-4.5 v9 z" fill="#9198a1" transform="rotate(0,262,175)"/><rect x="266" y="60" width="250" height="230" rx="12" fill="#2a1f3d" stroke="#bc8cff" stroke-width="1.5"/><text x="391" y="92" fill="#bc8cff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Lingua</text><text x="391" y="114" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">Mutation&#x27;s own parsers</text><line x1="326" y1="170" x2="366" y2="148" stroke="#bc8cff" stroke-width="1.5" opacity=".75"/><line x1="326" y1="170" x2="366" y2="194" stroke="#bc8cff" stroke-width="1.5" opacity=".75"/><line x1="366" y1="148" x2="412" y2="170" stroke="#bc8cff" stroke-width="1.5" opacity=".75"/><line x1="366" y1="194" x2="412" y2="170" stroke="#bc8cff" stroke-width="1.5" opacity=".75"/><line x1="412" y1="170" x2="456" y2="148" stroke="#bc8cff" stroke-width="1.5" opacity=".75"/><line x1="412" y1="170" x2="456" y2="194" stroke="#bc8cff" stroke-width="1.5" opacity=".75"/><circle cx="326" cy="170" r="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1.8"/><circle cx="366" cy="148" r="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1.8"/><circle cx="366" cy="194" r="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1.8"/><circle cx="412" cy="170" r="8" fill="#bc8cff" stroke="#bc8cff" stroke-width="1.8"/><circle cx="456" cy="148" r="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1.8"/><circle cx="456" cy="194" r="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1.8"/><text x="391" y="238" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">the code graph</text><text x="391" y="262" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" text-anchor="middle">.mutation/data.mt</text><path d="M518,175 C540,175 540,60 556,60" fill="none" stroke="#9198a1" stroke-width="1.6"/><path d="M564,60 l-9,-4.5 v9 z" fill="#9198a1"/><rect x="566" y="30" width="220" height="60" rx="10" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/><text x="584" y="56" fill="#3fb950" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Verify</text><text x="584" y="76" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">pass, fail or incomplete</text><path d="M518,175 C540,175 540,136 556,136" fill="none" stroke="#9198a1" stroke-width="1.6"/><path d="M564,136 l-9,-4.5 v9 z" fill="#9198a1"/><rect x="566" y="106" width="220" height="60" rx="10" fill="#0c2d4b" stroke="#58a6ff" stroke-width="1.5"/><text x="584" y="132" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Query</text><text x="584" y="152" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">callers, impact, SQL, Cypher</text><path d="M518,175 C540,175 540,212 556,212" fill="none" stroke="#9198a1" stroke-width="1.6"/><path d="M564,212 l-9,-4.5 v9 z" fill="#9198a1"/><rect x="566" y="182" width="220" height="60" rx="10" fill="#2e2410" stroke="#d29922" stroke-width="1.5"/><text x="584" y="208" fill="#d29922" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Context</text><text x="584" y="228" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">code within a token budget</text><path d="M518,175 C540,175 540,288 556,288" fill="none" stroke="#9198a1" stroke-width="1.6"/><path d="M564,288 l-9,-4.5 v9 z" fill="#9198a1"/><rect x="566" y="258" width="220" height="60" rx="10" fill="#2a1f3d" stroke="#bc8cff" stroke-width="1.5"/><text x="584" y="284" fill="#bc8cff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Report</text><text x="584" y="304" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">verify --output html=...</text><line x1="800" y1="60" x2="800" y2="288" stroke="#9198a1" stroke-width="1.6"/><line x1="788" y1="60" x2="800" y2="60" stroke="#9198a1" stroke-width="1.6"/><line x1="788" y1="136" x2="800" y2="136" stroke="#9198a1" stroke-width="1.6"/><line x1="788" y1="212" x2="800" y2="212" stroke="#9198a1" stroke-width="1.6"/><line x1="788" y1="288" x2="800" y2="288" stroke="#9198a1" stroke-width="1.6"/><line x1="800" y1="100" x2="822" y2="100" stroke="#9198a1" stroke-width="1.6"/><path d="M822,100 l-8,-4.5 v9 z" fill="#9198a1" transform="rotate(0,822,100)"/><rect x="826" y="80" width="108" height="40" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="880" y="106" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">You</text><line x1="800" y1="176" x2="822" y2="176" stroke="#9198a1" stroke-width="1.6"/><path d="M822,176 l-8,-4.5 v9 z" fill="#9198a1" transform="rotate(0,822,176)"/><rect x="826" y="156" width="108" height="40" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="880" y="182" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">CI</text><line x1="800" y1="252" x2="822" y2="252" stroke="#9198a1" stroke-width="1.6"/><path d="M822,252 l-8,-4.5 v9 z" fill="#9198a1" transform="rotate(0,822,252)"/><rect x="826" y="232" width="108" height="40" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="880" y="258" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Agents</text><text x="480" y="342" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">Runs on your machine. Nothing of your code leaves it.</text></svg>
