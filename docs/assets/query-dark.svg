<svg xmlns="http://www.w3.org/2000/svg" width="880" height="381" viewBox="0 0 880 381" role="img" aria-labelledby="t d"><title id="t">mutation query callers and cypher</title><desc id="d">An illustration of mutation query: the callers of billing::refund as a table, then the same question two hops out in openCypher.</desc><rect width="880" height="381" rx="12" fill="#0d1117" stroke="#30363d"/><path d="M0,12 a12,12 0 0 1 12,-12 h856 a12,12 0 0 1 12,12 v22 h-880 z" fill="#21262d"/><circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="38" cy="17" r="5.5" fill="#febc2e"/><circle cx="56" cy="17" r="5.5" fill="#28c840"/><text x="440.0" y="22" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">mutation query</text><text x="22" y="62" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="400">$ </tspan><tspan fill="#e6edf3" font-weight="600">mutation query callers billing::refund</tspan></text><text x="22" y="83" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="600">caller                    kind       place</tspan></text><text x="22" y="104" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bc8cff" font-weight="400">http::handlers::refund</tspan><tspan fill="#e6edf3" font-weight="400">    Function   </tspan><tspan fill="#9198a1" font-weight="400">src/http/handlers.rs:112</tspan></text><text x="22" y="125" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bc8cff" font-weight="400">jobs::retry::run</tspan><tspan fill="#e6edf3" font-weight="400">          Function   </tspan><tspan fill="#9198a1" font-weight="400">src/jobs/retry.rs:40</tspan></text><text x="22" y="146" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bc8cff" font-weight="400">admin::force_refund</tspan><tspan fill="#e6edf3" font-weight="400">       Function   </tspan><tspan fill="#9198a1" font-weight="400">src/admin/mod.rs:77</tspan></text><text x="22" y="167" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="400">3 rows, complete</tspan></text><text x="22" y="209" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="400">$ </tspan><tspan fill="#e6edf3" font-weight="600">mutation query cypher </tspan><tspan fill="#3fb950" font-weight="400">&quot;MATCH (c)-[:CALLS*1..2]-&gt;(t {key: &#x27;billing::refund&#x27;}) RETURN c.key&quot;</tspan></text><text x="22" y="230" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="600">c.key</tspan></text><text x="22" y="251" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bc8cff" font-weight="400">http::handlers::refund</tspan></text><text x="22" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bc8cff" font-weight="400">jobs::retry::run</tspan></text><text x="22" y="293" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bc8cff" font-weight="400">admin::force_refund</tspan></text><text x="22" y="314" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bc8cff" font-weight="400">http::routes::refund</tspan></text><text x="22" y="335" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bc8cff" font-weight="400">jobs::queue::drain</tspan></text><text x="22" y="356" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="400">5 rows, complete</tspan></text></svg>
