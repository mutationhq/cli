<svg xmlns="http://www.w3.org/2000/svg" width="880" height="381" viewBox="0 0 880 381" role="img" aria-labelledby="t d"><title id="t">mutation verify main..HEAD</title><desc id="d">An illustration of mutation verify&#x27;s text output: one new blocking finding, an invariant whose target is reached without its guard, shown with its call path; one fixed finding; the decision fail; exit code 3.</desc><rect width="880" height="381" rx="12" fill="#0d1117" stroke="#30363d"/><path d="M0,12 a12,12 0 0 1 12,-12 h856 a12,12 0 0 1 12,12 v22 h-880 z" fill="#21262d"/><circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="38" cy="17" r="5.5" fill="#febc2e"/><circle cx="56" cy="17" r="5.5" fill="#28c840"/><text x="440.0" y="22" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">mutation verify</text><text x="22" y="62" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="400">$ </tspan><tspan fill="#e6edf3" font-weight="600">mutation verify main..HEAD</tspan></text><text x="22" y="83" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="400">verify  </tspan><tspan fill="#e6edf3" font-weight="400">incremental</tspan><tspan fill="#9198a1" font-weight="400">  base </tspan><tspan fill="#e6edf3" font-weight="400">main</tspan><tspan fill="#9198a1" font-weight="400">  head </tspan><tspan fill="#e6edf3" font-weight="400">HEAD</tspan><tspan fill="#9198a1" font-weight="400">  settings </tspan><tspan fill="#e6edf3" font-weight="400">.github/mutation.yml @ main (local)</tspan></text><text x="22" y="125" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700"> NEW      </tspan><tspan fill="#ff7b72" font-weight="400">blocking  </tspan><tspan fill="#e6edf3" font-weight="600">invariant refund-needs-auth</tspan><tspan fill="#9198a1" font-weight="400">                     confidence 96%</tspan></text><text x="22" y="146" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#e6edf3" font-weight="400">          refund is reached on a path that skips require_auth</tspan></text><text x="22" y="167" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bc8cff" font-weight="400">          http::routes::refund</tspan><tspan fill="#9198a1" font-weight="400"> -&gt; </tspan><tspan fill="#bc8cff" font-weight="400">http::handlers::refund</tspan><tspan fill="#9198a1" font-weight="400"> -&gt; </tspan><tspan fill="#bc8cff" font-weight="400">billing::refund</tspan></text><text x="22" y="188" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="400">          src/http/handlers.rs:112</tspan></text><text x="22" y="230" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#3fb950" font-weight="700"> FIXED    </tspan><tspan fill="#e6edf3" font-weight="400">1 finding of the base is gone at head</tspan></text><text x="22" y="251" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9198a1" font-weight="700"> STANDING </tspan><tspan fill="#9198a1" font-weight="400">2 findings, unchanged from the base</tspan></text><text x="22" y="293" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" xml:space="p