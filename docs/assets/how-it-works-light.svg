<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">How Mutation works</title><desc id="d">A repository is read by Lingua into a code graph stored in .mutation/data.mt. mutation verify, query and context read it, for people, CI and coding agents.</desc><rect width="960" height="400" rx="14" fill="#ffffff" stroke="#d0d7de"/><rect x="24" y="92" width="188" height="216" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="118" y="120" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Your repository</text><text x="118" y="140" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">a clone from any git host</text><rect x="44" y="156" width="148" height="22" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="118" y="171" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" text-anchor="middle">worktree</text><rect x="44" y="184" width="148" height="22" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="118" y="199" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" text-anchor="middle">REV</text><rect x="44" y="212" width="148" height="22" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="118" y="227" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" text-anchor="middle">A..B   A...B</text><rect x="44" y="240" width="148" height="22" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="118" y="255" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" text-anchor="middle">--patch FILE</text><rect x="44" y="268" width="148" height="22" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="118" y="283" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" text-anchor="middle">a folder, no git</text><line x1="214" y1="200" x2="254" y2="200" stroke="#59636e" stroke-width="1.6"/><path d="M254,200 l-8,-4.5 v9 z" fill="#59636e" transform="rotate(0,254,200)"/><rect x="258" y="40" width="250" height="320" rx="12" fill="#fbefff" stroke="#6639ba" stroke-width="1.5"/><text x="383" y="68" fill="#6639ba" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Lingua</text><text x="383" y="88" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">Mutation&#x27;s own lexers and parsers</text><text x="383" y="104" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">streaming, no tree-sitter</text><rect x="278" y="120" width="210" height="108" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="383" y="142" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">code graph</text><line x1="320" y1="182" x2="360" y2="162" stroke="#6639ba" stroke-width="1.3" opacity=".7"/><line x1="320" y1="182" x2="360" y2="204" stroke="#6639ba" stroke-width="1.3" opacity=".7"/><line x1="360" y1="162" x2="404" y2="182" stroke="#6639ba" stroke-width="1.3" opacity=".7"/><line x1="360" y1="204" x2="404" y2="182" stroke="#6639ba" stroke-width="1.3" opacity=".7"/