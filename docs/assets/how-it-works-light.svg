" text-anchor="start">mutation context</text><text x="574" y="314" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">the code around a target,</text><text x="574" y="331" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">within a token budget</text><line x1="772" y1="96" x2="788" y2="96" stroke="#59636e" stroke-width="1.6"/><line x1="788" y1="96" x2="804" y2="96" stroke="#59636e" stroke-width="1.6"/><path d="M804,96 l-8,-4.5 v9 z" fill="#59636e" transform="rotate(0,804,96)"/><line x1="788" y1="96" x2="788" y2="304" stroke="#59636e" stroke-width="1.6"/><rect x="808" y="64" width="128" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="872" y="88" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">You</text><text x="872" y="106" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">text in the terminal</text><line x1="772" y1="200" x2="788" y2="200" stroke="#59636e" stroke-width="1.6"/><line x1="788" y1="200" x2="804" y2="200" stroke="#59636e" stroke-width="1.6"/><path d="M804,200 l-8,-4.5 v9 z" fill="#59636e" transform="rotate(0,804,200)"/><rect x="808" y="168" width="128" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="872" y="192" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">CI</text><text x="872" y="210" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">exit codes, SARIF,</text><text x="872" 